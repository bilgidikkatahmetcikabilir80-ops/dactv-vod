name: Update DACTVNET playlist

on:
  schedule:
    - cron: "0 */6 * * *"   # her 6 saatte bir (UTC)
  workflow_dispatch:
    inputs:
      full:
        description: "Tüm videoları yeniden tara (--full)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Playlist'i güncelle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERVER_BASE_URL: ${{ vars.SERVER_BASE_URL }}
        run: python update.py ${{ inputs.full && '--full' || '' }}

      - name: Değişiklikleri commit et
        run: |
          if [ -n "$(git status --porcelain playlist.m3u videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add playlist.m3u videos.json
            git commit -m "Playlist güncellendi: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "Değişiklik yok."
          fi

      - name: Hata logunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          if-no-files-found: ignore
